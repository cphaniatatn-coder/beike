<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>生詞刮刮樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b33;
    --gold:#e8b13a;
    --gold-dark:#c4901f;
    --red:#e2574c;
    --teal:#1f9d8c;
    --teal-dark:#136f63;
    --paper:#ffffff;
    --line:#eceae5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    background:var(--paper);
    font-family:'Noto Sans TC', "PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  .app{
    max-width:920px;
    margin:0 auto;
    padding:22px 16px 40px;
  }
  header{ text-align:center; margin-bottom:14px; }
  .ticket-badge{
    display:inline-block;
    font-size:12px;
    letter-spacing:.18em;
    font-weight:700;
    color:var(--gold-dark);
    border:1.5px dashed var(--gold);
    border-radius:999px;
    padding:4px 14px;
    margin-bottom:10px;
  }
  h1{
    font-size:clamp(26px,5vw,34px);
    font-weight:900;
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  h1 .em{ color:var(--gold-dark); }
  .hint{
    margin:0;
    color:#8a8a92;
    font-size:14px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:18px 0 16px;
    padding:10px 16px;
    background:#fafaf8;
    border:1px solid var(--line);
    border-radius:14px;
    flex-wrap:wrap;
  }
  .counter{
    font-size:14px;
    font-weight:700;
    color:#5b5b63;
  }
  .counter span{
    color:var(--red);
    font-size:16px;
  }
  .btn-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    color:#fff;
    padding:10px 16px;
    border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none; }
  .reset-btn{
    background:linear-gradient(135deg,#f2c14e,#e2574c);
    box-shadow:0 4px 14px rgba(226,87,76,.28);
  }
  .reset-btn:hover{ box-shadow:0 6px 16px rgba(226,87,76,.34); }
  .reveal-btn{
    background:linear-gradient(135deg,#3fc1ac,#136f63);
    box-shadow:0 4px 14px rgba(31,157,140,.28);
  }
  .reveal-btn:hover{ box-shadow:0 6px 16px rgba(31,157,140,.34); }

  .stage{ position:relative; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:12px;
  }

  .card{
    position:relative;
    aspect-ratio:4/3.2;
    border-radius:16px;
    overflow:hidden;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(0,0,0,.04);
    transform:scale(1);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .card.shuffling{ transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  .card.revealed{ animation:pop .4s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  .content{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:4px;
    text-align:center;
    padding:6px;
  }
  .content .emoji{ font-size:clamp(26px,6vw,34px); line-height:1; }
  .content .hanzi{
    font-size:clamp(18px,4.4vw,24px);
    font-weight:900;
    letter-spacing:.02em;
  }

  .card canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    cursor:pointer;
    touch-action:none;
    user-select:none;
    transition:opacity .35s ease;
  }
  .card canvas.fading{ opacity:0; }

  .sparkle{
    position:absolute;
    font-size:18px;
    pointer-events:none;
    animation:sparkle .6s ease forwards;
  }
  @keyframes sparkle{
    0%{ opacity:1; transform:translateY(0) scale(.6); }
    100%{ opacity:0; transform:translateY(-22px) scale(1.3); }
  }

  .shuffle-overlay{
    position:absolute; inset:0;
    background:rgba(255,255,255,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
    border-radius:18px;
    z-index:5;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .shuffle-overlay.show{ opacity:1; pointer-events:all; }
  .shuffle-spinner{
    width:38px; height:38px;
    border-radius:50%;
    border:4px solid var(--line);
    border-top-color:var(--gold);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .shuffle-overlay p{
    margin:0; font-weight:700; color:#8a8a92; font-size:14px; letter-spacing:.1em;
  }

  footer{
    text-align:center;
    margin-top:22px;
    font-size:12px;
    color:#b7b7bd;
  }

  @media (max-width:380px){
    .grid{ grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:9px; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .btn-group{ justify-content:center; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="ticket-badge">VOCAB SCRATCH CARD</span>
    <h1>生詞<span class="em">刮刮樂</span> 🎫</h1>
    <p class="hint">用手指刮一刮（或拍一拍）卡片，看看藏著哪個生詞！</p>
  </header>

  <div class="toolbar">
    <div class="counter">已刮開：<span id="count">0</span> / 13</div>
    <div class="btn-group">
      <button id="revealBtn" class="btn reveal-btn">👁️ 顯示生詞</button>
      <button id="resetBtn" class="btn reset-btn">🔄 重新洗牌</button>
    </div>
  </div>

  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="shuffle-overlay" id="shuffleOverlay">
      <div class="shuffle-spinner"></div>
      <p>洗牌中...</p>
    </div>
  </div>

  <footer>共 13 個生詞 · 每次重新洗牌位置都會不一樣</footer>
</div>

<script>
(function(){
  const WORDS = [
    {hanzi:"還有", emoji:"➕"},
    {hanzi:"喝",   emoji:"🥤"},
    {hanzi:"吃",   emoji:"🍴"},
    {hanzi:"今天", emoji:"📅"},
    {hanzi:"明天", emoji:"⏭️"},
    {hanzi:"昨天", emoji:"⏮️"},
    {hanzi:"來",   emoji:"🚶"},
    {hanzi:"牛奶", emoji:"🥛"},
    {hanzi:"水果", emoji:"🍎"},
    {hanzi:"果汁", emoji:"🧃"},
    {hanzi:"麵包", emoji:"🍞"},
    {hanzi:"還要", emoji:"🙋"},
    {hanzi:"早飯", emoji:"🍳"}
  ];

  const PALETTE = [
    ["#fff7e6","#7a5b14"],
    ["#fdeceb","#9b3b32"],
    ["#eaf6ee","#2f6b46"],
    ["#eef1fb","#3b4a8f"],
    ["#fdf0f7","#9c3a6c"],
    ["#eefaf8","#1f7368"],
    ["#fff3e2","#8a5a18"]
  ];

  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const resetBtn = document.getElementById('resetBtn');
  const revealBtn = document.getElementById('revealBtn');
  const overlay = document.getElementById('shuffleOverlay');

  let revealedCount = 0;
  const activeIntervals = new Set();

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function clearAllIntervals(){
    activeIntervals.forEach(id => clearInterval(id));
    activeIntervals.clear();
  }

  function drawCoating(ctx, w, h){
    ctx.clearRect(0,0,w,h);
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#d9dde3');
    g.addColorStop(0.5,'#c3c8d1');
    g.addColorStop(1,'#aab0bc');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 6;
    for(let x = -h; x < w; x += 14){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x+h,h);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = `bold ${Math.floor(h*0.16)}px "Noto Sans TC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('刮 / 拍 開我', w/2, h/2);
  }

  function buildCard(word, colorPair){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.revealed = 'false';

    const content = document.createElement('div');
    content.className = 'content';
    content.style.background = colorPair[0];
    content.style.color = colorPair[1];
    content.innerHTML = `<div class="emoji">${word.emoji}</div><div class="hanzi">${word.hanzi}</div>`;
    card.appendChild(content);

    const canvas = document.createElement('canvas');
    canvas.width = 300;
    canvas.height = 230;
    canvas.tabIndex = 0;
    canvas.setAttribute('role','button');
    canvas.setAttribute('aria-label', '刮開生詞卡片');
    card.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    drawCoating(ctx, canvas.width, canvas.height);

    let drawing = false;
    let lastPos = null;
    let checkTimer = null;

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function scratchAt(p, radius){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
      ctx.fill();
    }

    function scratchLine(a, b, radius){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = radius*2;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();
    }

    function checkProgress(){
      const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
      let cleared = 0, total = 0;
      for(let i = 3; i < data.length; i += 4*5){
        total++;
        if(data[i] < 60) cleared++;
      }
      if(total === 0) return;
      const pct = cleared/total*100;
      if(pct > 42){
        reveal();
      }
    }

    function reveal(){
      if(card.dataset.revealed === 'true') return;
      card.dataset.revealed = 'true';
      if(checkTimer){ clearInterval(checkTimer); activeIntervals.delete(checkTimer); checkTimer = null; }
      canvas.classList.add('fading');
      setTimeout(() => {
        canvas.style.display = 'none';
      }, 360);
      card.classList.add('revealed');
      revealedCount++;
      countEl.textContent = revealedCount;
      spawnSparkle(card);
    }

    function startCheckLoop(){
      if(checkTimer) return;
      checkTimer = setInterval(checkProgress, 180);
      activeIntervals.add(checkTimer);
    }

    function onDown(e){
      if(card.dataset.revealed === 'true') return;
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      drawing = true;
      const p = pos(e);
      lastPos = p;
      scratchAt(p, 46);
      startCheckLoop();
      checkProgress();
      e.preventDefault();
    }
    function onMove(e){
      if(!drawing || card.dataset.revealed === 'true') return;
      const p = pos(e);
      scratchLine(lastPos, p, 20);
      lastPos = p;
      e.preventDefault();
    }
    function onUp(e){
      drawing = false;
      lastPos = null;
      if(checkTimer){ clearInterval(checkTimer); activeIntervals.delete(checkTimer); checkTimer = null; }
    }

    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', onUp);
    canvas.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); reveal(); }
    });

    // 讓「顯示生詞」按鈕可以從外部呼叫這張卡的揭曉動作
    card._reveal = reveal;

    return card;
  }

  function spawnSparkle(card){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = '✨';
    s.style.left = '50%';
    s.style.top = '50%';
    card.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }

  function renderGrid(){
    grid.innerHTML = '';
    const order = shuffle(WORDS);
    order.forEach((word, i) => {
      const colorPair = PALETTE[i % PALETTE.length];
      grid.appendChild(buildCard(word, colorPair));
    });
  }

  function shuffleAnimationThenRender(){
    resetBtn.disabled = true;
    revealBtn.disabled = true;
    clearAllIntervals();
    overlay.classList.add('show');

    const cards = Array.from(grid.children);
    cards.forEach(c => {
      c.classList.add('shuffling');
      c.style.transform = `translate(${(Math.random()*14-7).toFixed(1)}px, ${(Math.random()*14-7).toFixed(1)}px) rotate(${(Math.random()*8-4).toFixed(1)}deg) scale(.94)`;
    });

    setTimeout(() => {
      revealedCount = 0;
      countEl.textContent = '0';
      renderGrid();
      overlay.classList.remove('show');
      resetBtn.disabled = false;
      revealBtn.disabled = false;
    }, 700);
  }

  function revealAllNow(){
    Array.from(grid.children).forEach(card => {
      if(card._reveal) card._reveal();
    });
  }

  resetBtn.addEventListener('click', shuffleAnimationThenRender);
  revealBtn.addEventListener('click', revealAllNow);

  // initial load: shuffle once before play, per teacher's request
  renderGrid();
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.remove('show');
  }, 900);
})();
</script>
</body>
</html>
